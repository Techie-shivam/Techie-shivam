<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <style>
    .number { font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; text-anchor: middle; }
    .label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7aa2f7; text-anchor: middle; }
    .date { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2ac3de; text-anchor: middle; }
    .fire { fill: #ff9e3b; }
    .fire-circle { stroke: #70a5fd; stroke-width: 4; fill: none; }
    .divider { stroke: #3b4261; stroke-width: 1; }
  </style>

  <rect width="495" height="195" rx="4.5" fill="#1a1b26"/>

  <!-- Left: Total Contributions -->
  <g transform="translate(85, 95)">
    <text x="0" y="-15" class="number">735</text>
    <text x="0" y="10" class="label">Total Contributions</text>
    <text x="0" y="30" class="date">Oct 1, 2025 – Present</text>
  </g>

  <line x1="170" y1="35" x2="170" y2="160" class="divider" />

  <!-- Center: Current Streak -->
  <g transform="translate(247, 95)">
    <circle cx="0" cy="-25" r="28" class="fire-circle"/>
    <path transform="translate(-10, -37) scale(1.2)" class="fire" d="M12 23c-4.97 0-9-4.03-9-9 0-4.12 3.03-7.55 7-8.72V7c0 .55.45 1 1 1s1-.45 1-1V3.5c0-.44-.29-.83-.71-.96C7.55 1.45 3.12 5.09 3.01 10.31 1.25 12.3 0 14.99 0 18c0 6.63 5.37 12 12 12s12-5.37 12-12c0-3.32-1.46-6.29-3.77-8.32-.4-.35-.98-.31-1.33.09-.35.4-.31.98.09 1.33C21.37 11.23 22.5 13.5 22.5 16c0 4.14-3.36 7.5-7.5 7.5s-7.5-3.36-7.5-7.5c0-1.95.75-3.72 1.97-5.06.33-.37.3-$.94-.07-1.27-.37-.33-.94-.3-1.27.07C6.72 11.3 6 13.56 6 16c0 3.31 2.69 6 6 6s6-2.69 6-6c0-1.2-.36-2.32-.98-3.26-.29-.44-.9-.57-1.34-.28-.44.29-.57.9-.28 1.34.4.61.6 1.33.6 2.2 0 2.21-1.79 4-4 4z"/>
    <text x="0" y="-20" class="number" style="fill: #bb9af7;">14</text>
    <text x="0" y="25" class="label" style="fill: #bb9af7;">Current Streak</text>
    <text x="0" y="45" class="date">Sep 18 – Oct 1</text>
  </g>

  <line x1="325" y1="35" x2="325" y2="160" class="divider" />

  <!-- Right: Longest Streak -->
  <g transform="translate(410, 95)">
    <text x="0" y="-15" class="number">48</text>
    <text x="0" y="10" class="label">Longest Streak</text>
    <text x="0" y="30" class="date">Jun 10 – Jul 28</text>
  </g>
</svg>
