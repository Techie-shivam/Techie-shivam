<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Shivam Goel - AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24c6dc"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24c6dc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>
  <g>
    <path d="M0 175 Q300 130 600 175 T1200 175 T1800 175 T2400 175 V240 H0 Z" fill="url(#wave)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M0 195 Q300 165 600 195 T1200 195 T1800 195 T2400 195 V240 H0 Z" fill="#ffffff" fill-opacity="0.08">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#ffffff">
    <circle cx="140" cy="60" r="3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="30" r="2" opacity="0.5"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="55" r="3" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="35" r="2" opacity="0.5"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="120" r="2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="600" y="112" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="2">Shivam Goel
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="155" font-size="22" font-weight="500" fill="#c9f4fb" letter-spacing="1.5">AI/ML Engineer  |  GenAI  |  Speech and Agentic Systems
      <animate attributeName="opacity" from="0" to="1" dur="1.8s" fill="freeze"/>
    </text>
  </g>
</svg>
